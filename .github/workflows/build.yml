name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Smoke test
        run: node test.mjs
      - name: Package .bobplugin
        run: python build.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobplugin
          path: dist/*.bobplugin
      # 标签 ocr-vX.Y.Z / tts-vX.Y.Z：只打包对应插件，校验 appcast 的 sha256 后发布 Release
      - name: Verify appcast sha256
        if: startsWith(github.ref, 'refs/tags/')
        run: python build.py --check
      - name: Release on tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/release/*.bobplugin
          generate_release_notes: true
